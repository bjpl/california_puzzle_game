    <title>California Counties Puzzle Game</title>

    <!-- Fix mobile viewport height issue - MUST run before styles -->
    <script>
      // Calculate real viewport height for mobile browsers (fixes iOS Safari address bar issue)
      function setViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }

      // Set immediately and on resize/orientation change
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', setViewportHeight);
    </script>

    <!-- Critical CSS for loading state -->
    <style>
      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #3b82f6, #1e40af);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 10000;
        transition: opacity 0.5s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        font-size: 4rem;
        margin-bottom: 1rem;
        animation: bounce 2s infinite;
      }

      .loading-text {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 2rem;
        text-align: center;
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .loading-progress {
        margin-top: 1rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-20px);
        }
        60% {
          transform: translateY(-10px);
        }
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Prevent FOUC - Mobile-friendly viewport height */
      #root {
        /* Use CSS custom property for mobile-friendly height */
        min-height: 100vh; /* Fallback for older browsers */
        min-height: calc(var(--vh, 1vh) * 100); /* Mobile fix: real viewport height */
        width: 100%;
        /* Start visible to prevent blank screen on mobile */
        opacity: 1;
      }

      /* No longer needed - root is always visible */
      /* Removed opacity transition that caused blank screens on mobile */
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo">🗺️</div>
      <div class="loading-text">California Counties Puzzle</div>
      <div class="loading-spinner"></div>
      <div class="loading-progress">Loading geography data...</div>
    </div>

    <!-- Main App Container -->
    <div id="root"></div>

    <!-- Loading Script -->
    <script>
      // Show loading screen immediately
      const loadingScreen = document.getElementById('loading-screen');
      const root = document.getElementById('root');

      // Update loading progress
      let loadingSteps = [
        'Loading application...',
        'Preparing map data...',
        'Initializing game engine...',
        'Ready to play!'
      ];

      let currentStep = 0;
      const progressElement = document.querySelector('.loading-progress');

      const updateProgress = () => {
        if (currentStep < loadingSteps.length) {
          progressElement.textContent = loadingSteps[currentStep];
          currentStep++;
          setTimeout(updateProgress, 500);
        }
      };

      // Start progress updates
      setTimeout(updateProgress, 500);

      // Hide loading screen when app is ready
      window.addEventListener('load', () => {
        // Wait for React to mount
        const checkReactMounted = () => {
          if (root.children.length > 0) {
            // React has mounted content
            setTimeout(() => {
              loadingScreen.classList.add('hidden');

              // Remove loading screen after transition
              setTimeout(() => {
                loadingScreen.style.display = 'none';
              }, 500);
            }, 500); // Brief delay to ensure rendering
          } else {
            // Check again in 100ms
            setTimeout(checkReactMounted, 100);
          }
        };

        // Start checking after minimum load time
        setTimeout(checkReactMounted, 1500);

        // Fallback: force show after 5 seconds regardless
        setTimeout(() => {
          if (loadingScreen.style.display !== 'none') {
            console.warn('React mount timeout - hiding loading screen anyway');
            loadingScreen.classList.add('hidden');
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 5000);
      });

      // Handle app initialization errors
      window.addEventListener('error', (error) => {
        console.error('App initialization error:', error);
        progressElement.textContent = 'Error loading game. Please refresh the page.';
        progressElement.style.color = '#fbbf24';
      });
    </script>

    <!-- Main App Script -->
    <script type="module" src="./src/main.tsx"></script>

    <!-- Service Worker is registered from main.tsx in production builds -->
    <!-- This ensures proper timing and error handling with app lifecycle -->

    <!-- Analytics placeholder -->
    <!-- Add your analytics code here -->
  </body>
