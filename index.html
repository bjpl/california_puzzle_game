<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/california-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Performance: DNS Prefetch for external domains -->
    <!-- Reduces DNS lookup time by ~50-150ms per request -->
    <link rel="dns-prefetch" href="//pfwberdnxkuvuupjmauq.supabase.co" />
    <link rel="preconnect" href="//pfwberdnxkuvuupjmauq.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Security: Content Security Policy (hardened - no unsafe-inline) -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' https://fonts.googleapis.com;
                   img-src 'self' data: https:;
                   connect-src 'self' https://pfwberdnxkuvuupjmauq.supabase.co https://*.supabase.co;
                   font-src 'self' data: https://fonts.gstatic.com;
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';">

    <meta name="description" content="Interactive California Counties Puzzle Game - Learn California geography through an engaging drag-and-drop puzzle game with D3.js visualizations." />
    <meta name="keywords" content="California, counties, puzzle, geography, education, game, D3.js, interactive, learning" />
    <meta name="author" content="California Puzzle Game" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://california-puzzle.vercel.app/" />
    <meta property="og:title" content="California Counties Puzzle Game" />
    <meta property="og:description" content="Learn California geography through an interactive puzzle game. Drag and drop counties to their correct locations!" />
    <meta property="og:image" content="/california-puzzle-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://california-puzzle.vercel.app/" />
    <meta property="twitter:title" content="California Counties Puzzle Game" />
    <meta property="twitter:description" content="Learn California geography through an interactive puzzle game. Drag and drop counties to their correct locations!" />
    <meta property="twitter:image" content="/california-puzzle-preview.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CA Puzzle" />
    <link rel="apple-touch-icon" href="/california_puzzle_game/california-icon.svg" />
    <link rel="manifest" href="/california_puzzle_game/manifest.json" />

    <!-- Preload critical resources -->
    <!-- GeoJSON files are loaded dynamically via code splitting -->
    <!-- Prefetch likely next routes/components -->
    <link rel="prefetch" href="/src/components/study/EnhancedStudyMode.tsx" as="script" />
    <link rel="prefetch" href="/src/components/game/achievements/AchievementGallery.tsx" as="script" />

    <title>California Counties Puzzle Game</title>

    <!-- Fix mobile viewport height issue - external script for CSP compliance -->
    <script src="/scripts/viewport-fix.js"></script>

    <!-- Critical CSS for loading state - external for CSP compliance -->
    <link rel="stylesheet" href="/styles/loading.css">
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo">🗺️</div>
      <div class="loading-text">California Counties Puzzle</div>
      <div class="loading-spinner"></div>
      <div class="loading-progress">Loading geography data...</div>
    </div>

    <!-- Main App Container -->
    <div id="root"></div>

    <!-- Loading Script - external for CSP compliance -->
    <script src="/scripts/loading-screen.js"></script>

    <!-- Main App Script -->
    <script type="module" src="./src/main.tsx"></script>

    <!-- Service Worker is registered from main.tsx in production builds -->
    <!-- This ensures proper timing and error handling with app lifecycle -->

    <!-- Analytics placeholder -->
    <!-- Add your analytics code here -->
  </body>
</html>
